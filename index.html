<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktaufnahme – Lysann Humboldt</title>
    <style>
        :root {
            --primary-color: #8a79f0;
            --primary-hover: #9b8ef4;
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-main: #f1f1f6;
            --text-muted: #9ba1a6;
            --border-color: #2c2c35;
            --input-bg: #161619;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Profile Header Card */
        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .profile-image {
            width: 170px;
            height: 170px;
            object-fit: cover;
            /* Verschiebt den Ausschnitt weiter nach rechts (70%) und oben (15%) */
            object-position: 62% 08%; 
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: block;
            border: 4px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(138, 121, 240, 0.3);
        }

        .profile-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .profile-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            text-align: left;
        }

        .profile-item {
            background: var(--input-bg);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .profile-item label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .profile-item span {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Form Card */
        .form-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: var(--input-bg);
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(138, 121, 240, 0.2);
        }

        input[type="file"].form-control {
            padding: 9px 12px;
            background: var(--input-bg);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #121214;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Profil Steckbrief -->
    <div class="profile-card">
        <img src="lysann.png" alt="Lysann Humboldt" class="profile-image">
        
        <div class="profile-title">Lysann Humboldt</div>
        <div class="profile-subtitle">Steckbrief & Informationen</div>
        
        <div class="profile-grid">
            <div class="profile-item">
                <label>Alter</label>
                <span>18 (Juni 2008)</span>
            </div>
            <div class="profile-item">
                <label>Größe</label>
                <span>1,82 m</span>
            </div>
            <div class="profile-item">
                <label>Haarfarbe</label>
                <span>Dunkelblond (gefärbte Spitzen)</span>
            </div>
            <div class="profile-item">
                <label>Augenfarbe</label>
                <span>Hellblau / Eisblau</span>
            </div>
            <div class="profile-item" style="grid-column: 1 / -1;">
                <label>Das liebe ich</label>
                <span>Musik, Schreiben, Filme, Videospiele</span>
            </div>
        </div>
    </div>

    <!-- Formular -->
    <div class="form-card">
        <div class="form-title">Antrag für Kontaktaufnahme</div>

        <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
            
            <input type="hidden" name="apikey" value="DEIN-ACCESS-KEY-HIER-EINTRAGEN">
            <input type="hidden" name="subject" value="Neuer Antrag für Kontaktaufnahme eingegangen!">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Dein vollständiger Name" required>
            </div>

            <div class="form-group">
                <label for="geburtsdatum">Geburtstag und Alter</label>
                <input type="text" id="geburtsdatum" name="geburtsdatum_alter" class="form-control" placeholder="z. B. 12.04.2005 (19 Jahre)" required>
            </div>

            <div class="form-group">
                <label for="foto">Dein Foto</label>
                <input type="file" id="foto" name="foto" accept="image/*" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="beschaeftigung">Beschäftigung</label>
                <input type="text" id="beschaeftigung" name="beschaeftigung" class="form-control" placeholder="Beruf, Studium oder Schule" required>
            </div>

            <div class="form-group">
                <label for="worte">Drei Wörter, die dich beschreiben</label>
                <input type="text" id="worte" name="drei_woerter" class="form-control" placeholder="z. B. Humorvoll, Ehrlich, Unternehmungslustig" required>
            </div>

            <div class="form-group">
                <label for="hobbies">Drei deiner Hobbys / Lieblingsaktivitäten</label>
                <input type="text" id="hobbies" name="hobbies" class="form-control" placeholder="Deine Lieblingsbeschäftigungen" required>
            </div>

            <div class="form-group">
                <label for="musik">Was für Musik hörst du?</label>
                <input type="text" id="musik" name="musik" class="form-control" placeholder="Genren, Künstler oder Bands" required>
            </div>

            <div class="form-group">
                <label for="kontakt">Deine Kontaktinformation</label>
                <input type="text" id="kontakt" name="kontaktinformation" class="form-control" placeholder="Instagram, E-Mail oder Handynummer" required>
            </div>

            <input type="checkbox" name="botcheck" style="display: none;">

            <button type="submit" class="btn-submit">Antrag absenden</button>
        </form>
    </div>

</div>

</body>
</html>
